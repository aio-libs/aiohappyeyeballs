name: CI

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: pre-commit/action@v3.0.1

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
          allow-prereleases: true
      - name: Install Dependencies
        run: poetry install
        shell: bash
      - name: Test with Pytest
        run: poetry run pytest --cov-report=xml
        shell: bash
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Runs on the main push (records the baseline) and every PR (compares against
  # it). Uses CodSpeed's tokenless OAuth (no token input), which also lets fork
  # PRs report. Pinned to a single stock CPython so the callgrind baseline is
  # stable. Pinned to ubuntu-24.04 because the CodSpeed runner reports
  # "Unsupported system" on ubuntu-26.04 (the current ubuntu-latest).
  benchmarks:
    name: Benchmarks (CodSpeed)
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install Dependencies
        run: poetry install --with benchmarks
        shell: bash
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: poetry run pytest tests/benchmarks --codspeed --no-cov

  build:
    name: Build distribution packages
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry
      - name: Install Dependencies
        run: poetry install --only main,test_build
        shell: bash
      - name: Build and check distribution packages
        shell: bash
        run: |
          poetry build
          poetry run python -Im twine check --strict dist/*
      - name: Store the distribution packages
        uses: actions/upload-artifact@v7
        with:
          name: python-package-distributions
          path: dist/

  # See RELEASING.md.
  deploy:
    name: Deploy
    needs:
      - build
    # Run only on pushing a tag
    if: >-
      github.event_name == 'push'
      && github.ref_type == 'tag'
      && github.repository == 'aio-libs/aiohappyeyeballs'
    runs-on: ubuntu-latest

    permissions:
      contents: write # IMPORTANT: mandatory for making GitHub Releases
      id-token: write # IMPORTANT: mandatory for trusted publishing & sigstore

    environment:
      name: pypi
      url: https://pypi.org/p/aiohappyeyeballs

    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Download distributions
        uses: actions/download-artifact@v8
        with:
          name: python-package-distributions
          path: dist
      - name: Collected dists
        run: |
          tree dist
      # Also checks that the tag, __version__ and the built dists agree.
      - name: Extract release notes from changelog
        uses: aio-libs/get-releasenote@v1.4.5
        with:
          changes_file: CHANGELOG.md
          output_file: release-notes.md
          version_file: src/aiohappyeyeballs/__init__.py
          dist_dir: dist
          start_line: "<!-- towncrier release notes start -->"
          # Matches Towncrier's "## 1.2.3" + "*date*" headings as well as the
          # older "## v1.2.3 (date)" ones written by python-semantic-release.
          head_line: '## v?{version}(?: \({date}\))?(?:\n\n\*{date}\*)?\n?'
          check_ref: ${{ github.ref }}
          # The change notes use MyST roles, which GitHub releases don't render.
          fix_issue_regex: >-
            \{issue\}`(\d+)`
          fix_issue_repl: >-
            #\1
      - name: Turn the remaining MyST roles into GitHub syntax
        shell: python
        run: |
          import pathlib, re

          notes = pathlib.Path("release-notes.md")
          text = re.sub(r"\{user\}`([^`]+)`", r"@\1", notes.read_text())
          text = re.sub(r"\{commit\}`([0-9a-f]+)`", r"\1", text)
          notes.write_text(text)

      - name: >-
          Publish 🐍📦 to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # Allow re-running the deploy job after a partial PyPI upload
          # without failing on dists that were already published.
          skip-existing: true

      - name: Sign the dists with Sigstore
        uses: sigstore/gh-action-sigstore-python@v3.5.0
        with:
          inputs: >-
            ./dist/*.tar.gz
            ./dist/*.whl

      - name: Make GitHub Release
        # Creates the release, or updates it when the deploy job is re-run.
        uses: softprops/action-gh-release@v3.0.3
        with:
          body_path: release-notes.md
          # dist/ contains the built packages plus the Sigstore signatures
          # and certificates emitted alongside them by the signing step above.
          files: dist/**
