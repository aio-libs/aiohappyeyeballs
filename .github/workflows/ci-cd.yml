name: CI

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: pre-commit/action@v3.0.1

  test:
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
          - "3.15"
        os:
          - ubuntu-latest
          - windows-latest
          - macOS-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: "poetry"
          allow-prereleases: true
      - name: Install Dependencies
        run: poetry install
        shell: bash
      - name: Test with Pytest
        run: poetry run pytest --cov-report=xml
        shell: bash
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  # Runs on the main push (records the baseline) and every PR (compares against
  # it). Uses CodSpeed's tokenless OAuth (no token input), which also lets fork
  # PRs report. Pinned to a single stock CPython so the callgrind baseline is
  # stable. Pinned to ubuntu-24.04 because the CodSpeed runner reports
  # "Unsupported system" on ubuntu-26.04 (the current ubuntu-latest).
  benchmarks:
    name: Benchmarks (CodSpeed)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "poetry"
      - name: Install Dependencies
        run: poetry install --with benchmarks
        shell: bash
      - name: Run benchmarks
        uses: CodSpeedHQ/action@v5
        with:
          mode: simulation
          run: poetry run pytest tests/benchmarks --codspeed --no-cov

  build:
    name: Build distribution packages
    needs:
      - test
      - lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Set up uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          enable-cache: true
      - name: Install Poetry
        run: uv tool install poetry
      - name: Install Dependencies
        run: poetry install --only main,test_build
        shell: bash
      - name: Build and check distribution packages
        shell: bash
        run: |
          poetry build
          poetry run python -Im twine check --strict dist/*
